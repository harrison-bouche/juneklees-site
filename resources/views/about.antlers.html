<header class="overflow-hidden">
    <div class="py-12 mx-auto max-w-3xl flex flex-col items-center gap-12 md:px-12 md:gap-12 md:flex-row">
        <div class="px-5 sm:px-24 md:px-0 space-y-6 md:w-1/2 md:mt-16 lg:mt-28">
            <h1>
                {{ partial:section_heading :heading="page_section_heading" }}
            </h1>
        </div>

        <div class="relative w-full md:w-1/2">
            <div class="px-5 sm:px-24 md:px-0">
                <div class="mx-auto md:mx-0 max-w-sm relative z-1 size-64 aspect-square md:mt-16 lg:mt-28 lg:mx-auto">
                    {{ featured_image }}
                    <img src="{{ url }}" alt="{{ alt }}" class="w-full h-full scale-90 origin-top-left rounded-3xl object-cover" />
                    {{ /featured_image }}
                </div>
            </div>

            <div class="w-full absolute top-8 md:top-0 md:-right-24 lg:right-[-30dvw] lg:w-[40dvw]">
                <span class="block w-full h-24 lg:h-[max(112px,6dvw)] translate-y-20 -rotate-20 scale-125 bg-tan"></span>
                <span class="block w-full h-24 lg:h-[max(112px,6dvw)] translate-y-15 -rotate-12 scale-125 bg-tan-dark"></span>
                <span class="block w-full h-24 lg:h-[max(112px,6dvw)] translate-y-8 -rotate-6 scale-125 bg-tan-ex-dark"></span>
                <span class="block w-full h-24 lg:h-[max(112px,6dvw)] scale-125 bg-tan-light"></span>
            </div>
        </div>
    </div>
</header>

<div class="pt-8 pb-12 px-4 mx-auto max-w-[56ch] text-lg leading-[1.8] wrap-anywhere md:pt-0 md:pb-36">
    <div class="prose">{{ content | widont }}</div>
</div>

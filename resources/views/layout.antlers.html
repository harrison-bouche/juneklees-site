<!doctype html>
<html class="scroll-pt-8 scheme-light dark:scheme-dark" lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">

        {{ if {installed:statamic/seo-pro} }}
            {{ seo_pro:meta }}
        {{ else }}
            <title>{{ title ?? 'Page not found' }} — {{ settings:site_name }}</title>
            <meta name="description" content="{{ excerpt ?? title ?? 'Page not found' }}">
        {{ /if }}

        {{ vite src="resources/js/site.js|resources/css/site.css" }}
    </head>
    <body class="relative min-h-svh bg-tan-light font-sans text-pretty text-crimson-dark antialiased [&_a]:underline-offset-[0.22em] [&_button]:cursor-pointer">
        <a href="#main" class="absolute -top-24 left-4 z-20 bg-tan-light px-4 py-3 focus:top-4">Skip to content</a>
        {{ partial:nav }}
        <main id="main" class="isolate" tabindex="-1">
            {{ template_content }}
        </main>
        {{ partial:footer }}
    </body>
</html>

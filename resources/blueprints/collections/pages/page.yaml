title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: section_heading
            prefix: page_
          -
            handle: content
            field:
              escape_markup: true
              type: markdown
              display: Content
          -
            handle: template
            field:
              type: template
              display: Template
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              character_limit: 0
              display: 'Page Title'
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: featured_image
            field:
              container: assets
              folder: images
              restrict: true
              max_files: 1
              type: assets
              display: 'Featured Image'

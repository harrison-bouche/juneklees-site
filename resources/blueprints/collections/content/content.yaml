tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: link
            field:
              default_option: url
              type: link
              display: 'Link to Content'
              width: 50
          -
            handle: affiliate
            field:
              type: text
              display: Organization/Affiliate
              width: 50
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: appeared_on
            field:
              timezone: America/Detroit
              type: date
              display: 'Appeared On'
          -
            handle: category
            field:
              taxonomies:
                - categories
              create: false
              mode: select
              max_items: 1
              type: terms
              display: Category
title: Content

tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              autocomplete: name
              type: text
              display: 'Individual or Business Name'
              validate:
                - required
          -
            handle: email
            field:
              input_type: email
              type: text
              display: Email
              width: 50
              validate:
                - required
          -
            handle: phone_number
            field:
              type: text
              display: 'Phone Number'
              width: 50
          -
            handle: contact_message
            field:
              rows: 6
              type: textarea
              display: Message
              validate:
                - required
